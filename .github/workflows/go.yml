name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Read the version from go.mod rather than pinning one here. The pinned
        # 1.21 disagreed with the 1.22.7 go.mod requires, so the build depended
        # on the toolchain being downloaded on the fly and the linter ran a
        # type checker that could not parse the module at all.
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    # The race detector is the reason this step exists: the request loggers
    # shared one logrus entry across every in-flight request for as long as
    # nobody ran it.
    - name: Test
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Coverage
      run: go tool cover -func=coverage.out | tail -1

  # Integration tests live in their own module and drive real Postgres, Redis
  # and Kafka containers. They are the only thing that can establish the
  # properties the unit tests can only assume — that FOR UPDATE SKIP LOCKED
  # really stops two couriers publishing the same event, that a consumer group's
  # committed offset really advances past unhandled messages — so they are a
  # required check, not a nightly one.
  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: |
          go.sum
          test/integration/go.sum

    # testcontainers finds the Docker daemon the runner already provides.
    - name: Integration tests
      working-directory: test/integration
      run: go test -tags=integration -timeout 20m ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # Configured by .golangci.yml, which enables gosec among others — three
    # HTTP servers shipped without a ReadHeaderTimeout because nothing checked.
    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        # Pinned to the version the tree is verified against. gosec's overflow
        # analysis differs between releases, so an unpinned or older binary
        # reports findings the tree was never checked for.
        version: v2.12.2

    - name: Lint integration tests
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.12.2
        working-directory: test/integration
        args: --build-tags=integration
